name: Validate research data and corpus tools
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF extraction dependency
        run: python -m pip install -e '.[corpus]'
      - name: Validate 225 records, acquisition ledger and offline software fixtures
        run: make reproduce
      - name: Check generated tables are current
        run: git diff --exit-code -- reports
