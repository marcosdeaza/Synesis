name: Reproduce pilot and validate full research snapshot
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild CC0 pilot and validate all 225 research records offline
        run: make reproduce
      - name: Check generated tables are current
        run: git diff --exit-code -- reports
