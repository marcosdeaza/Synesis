[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synesis-research"
version = "0.1.0"
description = "Auditable observatory of university theses across the generative AI transition"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT (code only; see RIGHTS.md)"}
dependencies = []

[project.optional-dependencies]
figures = ["matplotlib==3.9.4", "numpy==2.0.2"]

[project.scripts]
synesis = "synesis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
